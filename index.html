<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대중문화예술기획업 등록 현황</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #16181d; --muted: #667085;
    --border: #e1e4ea; --accent: #2f5bea;
    --ok-bg: #e3f6ea; --ok: #12703a; --bad-bg: #fde8e8; --bad: #b42318;
    --warn-bg: #fff3d6; --warn: #8a5a00; --neutral-bg: #eceef2; --neutral: #475467;
    --info-bg: #e6edff; --info: #2446b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --surface: #1a1d24; --text: #eceef2; --muted: #98a2b3;
      --border: #2c313b; --accent: #7b9bff;
      --ok-bg: #12301f; --ok: #6fdc9a; --bad-bg: #3a1614; --bad: #ff9a8f;
      --warn-bg: #382a08; --warn: #f5c451; --neutral-bg: #262a33; --neutral: #b4bcc9;
      --info-bg: #1a2547; --info: #a9bdff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, button {
    font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; background: var(--bg); min-width: 0;
  }
  input:focus, select:focus, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; background: var(--surface); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .row > .grow { flex: 1 1 240px; }
  .row > .grow input { width: 100%; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; white-space: pre-wrap; }
  .count { margin: 0 0 12px; color: var(--muted); font-size: 14px; min-height: 21px; }

  details.changes summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  details.changes summary h2 { display: inline; }
  ul.events { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.events li { display: grid; grid-template-columns: 92px 132px 1fr; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; align-items: baseline; }
  ul.events .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  ul.events .what { min-width: 0; }
  .linklike { font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; background: none; border: 0; padding: 0; text-align: left; }
  .more { margin-top: 12px; }
  @media (max-width: 560px) { ul.events li { grid-template-columns: auto 1fr; } ul.events .what { grid-column: 1 / -1; } }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--muted); font-weight: 600; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tabs .n { font-weight: 400; font-size: 13px; margin-left: 4px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.nowrap { white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody tr.item { cursor: pointer; }
  tbody tr.item:hover { background: var(--bg); }
  tr.detail td { background: var(--bg); }
  td.name { font-weight: 600; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.neutral { background: var(--neutral-bg); color: var(--neutral); }
  .badge.info { background: var(--info-bg); color: var(--info); }
  .small { color: var(--muted); font-size: 12px; }
  dl.fields { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 4px 16px; margin: 0; font-size: 13px; }
  dl.fields dt { color: var(--muted); }
  dl.fields dd { margin: 0; word-break: break-all; }
  .detail-actions { margin-top: 12px; font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  #sentinel { height: 1px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>대중문화예술기획업 등록 현황</h1>
  <p class="sub" id="meta">행정안전부 인허가 데이터(공공데이터포털) 기준</p>

  <div class="notice" id="notice" hidden></div>

  <details class="card changes" id="changesCard" open hidden>
    <summary><h2>최근 변동사항</h2><span class="small" id="changesMeta"></span></summary>
    <ul class="events" id="events"></ul>
    <button class="more" id="moreEvents" type="button" hidden>이전 변동 더 보기</button>
  </details>

  <div id="listArea" hidden>
    <div class="tabs" id="tabs" role="tablist" hidden></div>

    <form class="card" id="form" role="search">
      <div class="row">
        <div class="grow">
          <label for="q" id="qLabel">검색</label>
          <input id="q" type="search">
        </div>
        <div>
          <label for="stts" id="sttsLabel">상태</label>
          <select id="stts"></select>
        </div>
        <div>
          <label for="sort">정렬</label>
          <select id="sort"></select>
        </div>
      </div>
    </form>

    <p class="count" id="count"></p>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr id="head"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>조건에 맞는 정보가 없습니다.</div>
      <div id="sentinel"></div>
    </div>
  </div>
</main>

<script>
// 데이터는 scripts/sync.py 가 매일 갱신하는 정적 파일에서 읽는다 (브라우저에서 API를 직접 호출하지 않음).
const BATCH = 200;        // 스크롤할 때마다 추가로 그리는 행 수
const EVENTS_STEP = 20;

const PERMIT_LABELS = {
  BPLC_NM: '사업장명', SALS_STTS_CD: '영업상태코드', SALS_STTS_NM: '영업상태',
  DTL_SALS_STTS_CD: '상세영업상태코드', DTL_SALS_STTS_NM: '상세영업상태',
  LCPMT_YMD: '인허가일자', LCPMT_RTRCN_YMD: '인허가취소일자', CLSBIZ_YMD: '폐업일자',
  TCBIZ_BGNG_YMD: '휴업시작일자', TCBIZ_END_YMD: '휴업종료일자',
  ROAD_NM_ADDR: '도로명주소', LOTNO_ADDR: '지번주소', TELNO: '전화번호',
  CULTR_BZMN_SE_NM: '문화사업자구분', MNG_NO: '관리번호', OPN_ATMY_GRP_CD: '개방자치단체코드',
  DAT_UPDT_PNT: '데이터갱신시점', LAST_MDFCN_PNT: '최종수정시점',
};

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter((c) => c != null && c !== ''));
  return node;
}

function fmtDate(v) {
  const s = String(v ?? '');
  return /^\d{8}$/.test(s) ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}` : s;
}
function fmtStamp(v) {
  const s = String(v ?? '');
  return /^\d{14}$/.test(s) ? `${fmtDate(s.slice(0, 8))} ${s.slice(8, 10)}:${s.slice(10, 12)}` : s;
}

function badgeClass(name) {
  if (/폐업|취소|말소|만료/.test(name)) return 'bad';
  if (/휴업|정지|중지/.test(name)) return 'warn';
  if (/영업|정상|계속/.test(name)) return 'ok';
  return 'neutral';
}
const badge = (name) => el('span', { className: `badge ${badgeClass(name)}` }, name);
const norm = (s) => String(s ?? '').toLowerCase().replace(/\s+/g, '');
// '(주)가나', '주식회사 가나' 처럼 표기가 달라도 서로 찾을 수 있게 법인 표기를 뗀 이름
const coreName = (s) => String(s ?? '')
  .replace(/주식회사|유한책임회사|유한회사|농업회사법인|\(주\)|㈜|\(유\)|\(사\)|\(재\)/g, ' ').trim();

/* ---------- 두 목록(탭)의 정의 ---------- */
const views = {
  permit: {
    tab: '인허가 등록 현황', url: 'data/planners.json', rows: [],
    qLabel: '검색 (사업장명 · 주소 · 전화번호)', placeholder: '예: 엔터테인먼트, 강남구', sttsLabel: '영업상태',
    head: ['사업장명', '영업상태', '인허가일자', '폐업일자', '소재지', '전화'],
    status: (r) => r.SALS_STTS_NM || '',
    text: (r) => [r.BPLC_NM, r.ROAD_NM_ADDR, r.LOTNO_ADDR, r.TELNO].join(' '),
    sorts: {
      licensed: ['인허가일 최신순', (a, b) => (b.LCPMT_YMD || '').localeCompare(a.LCPMT_YMD || '')],
      updated: ['최근 수정순', (a, b) => (b.LAST_MDFCN_PNT || b.DAT_UPDT_PNT || '').localeCompare(a.LAST_MDFCN_PNT || a.DAT_UPDT_PNT || '')],
      name: ['사업장명순', (a, b) => (a.BPLC_NM || '').localeCompare(b.BPLC_NM || '', 'ko')],
    },
    cells: (r) => {
      const stts = r.SALS_STTS_NM || '', dtl = r.DTL_SALS_STTS_NM || '';
      return [
        el('td', { className: 'name' }, r.BPLC_NM || '-'),
        el('td', {}, badge(stts || dtl || '-'), dtl && dtl !== stts ? el('div', { className: 'small' }, dtl) : null),
        el('td', { className: 'nowrap' }, fmtDate(r.LCPMT_YMD) || '-'),
        el('td', { className: 'nowrap' }, fmtDate(r.CLSBIZ_YMD) || '-'),
        el('td', {}, r.ROAD_NM_ADDR || r.LOTNO_ADDR || '-'),
        el('td', { className: 'nowrap' }, r.TELNO || '-'),
      ];
    },
    fields: (r) => Object.entries(r)
      .filter(([k, v]) => !k.startsWith('_') && v != null && v !== '')
      .map(([k, v]) => [PERMIT_LABELS[k] || k, /_YMD$/.test(k) ? fmtDate(v) : /_PNT$/.test(k) ? fmtStamp(v) : String(v)]),
    name: (r) => r.BPLC_NM, other: 'nts', otherLabel: '국세청 사업자 상태에서 같은 이름 찾기',
  },
  nts: {
    tab: '국세청 사업자 상태', url: 'data/nts.json', rows: [],
    qLabel: '검색 (기업명)', placeholder: '예: 엔터테인먼트', sttsLabel: '사업자 상태',
    head: ['기업명', '사업자 상태', '과세유형', '폐업일자'],
    status: (r) => r.status || '',
    text: (r) => r.name,
    sorts: {
      name: ['기업명순', (a, b) => (a.name || '').localeCompare(b.name || '', 'ko')],
      end: ['폐업일 최신순', (a, b) => (b.end || '').localeCompare(a.end || '')],
    },
    cells: (r) => [
      el('td', { className: 'name' }, r.name || '-'),
      el('td', {}, badge(r.status || '-')),
      el('td', {}, r.tax || '-'),
      el('td', { className: 'nowrap' }, fmtDate(r.end) || '-'),
    ],
    fields: (r) => [['기업명', r.name], ['사업자 상태', r.status], ['과세유형', r.tax], ['폐업일자', fmtDate(r.end)]]
      .filter(([, v]) => v),
    name: (r) => r.name, other: 'permit', otherLabel: '인허가 등록 현황에서 같은 이름 찾기',
  },
};
for (const v of Object.values(views)) Object.assign(v, { q: '', stts: '', sort: Object.keys(v.sorts)[0], filtered: [], shown: 0 });
let current = 'permit';

/* ---------- 목록 그리기 ---------- */
function rowNode(view, row) {
  const tr = el('tr', { className: 'item', title: '클릭하면 전체 항목을 볼 수 있습니다' }, ...view.cells(row));
  let detail = null;
  tr.onclick = () => {
    if (detail) { detail.remove(); detail = null; return; }
    const dl = el('dl', { className: 'fields' });
    for (const [label, value] of view.fields(row)) dl.append(el('dt', {}, label), el('dd', {}, value));
    const cell = el('td', { colSpan: view.head.length }, dl);
    if (views[view.other].rows.length) {
      const jump = el('button', { className: 'linklike', type: 'button' }, view.otherLabel);
      jump.onclick = (e) => { e.stopPropagation(); openIn(view.other, coreName(view.name(row))); };
      cell.append(el('div', { className: 'detail-actions' }, jump,
        el('span', { className: 'small' }, ' (이름이 같은 다른 업체일 수 있습니다)')));
    }
    detail = el('tr', { className: 'detail' }, cell);
    tr.after(detail);
  };
  return tr;
}

function renderMore() {
  const view = views[current];
  const next = view.filtered.slice(view.shown, view.shown + BATCH);
  if (!next.length) return;
  $('rows').append(...next.map((r) => rowNode(view, r)));
  view.shown += next.length;
}

function applyFilters() {
  const view = views[current];
  view.q = $('q').value; view.stts = $('stts').value; view.sort = $('sort').value;
  const q = norm(view.q);
  view.filtered = view.rows
    .filter((r) => (!view.stts || view.status(r) === view.stts) && (!q || r._text.includes(q)))
    .sort(view.sorts[view.sort][1]);
  view.shown = 0;
  $('rows').replaceChildren();
  renderMore();
  $('empty').hidden = view.filtered.length > 0;
  const total = view.rows.length.toLocaleString('ko-KR');
  const hit = view.filtered.length.toLocaleString('ko-KR');
  $('count').textContent = view.filtered.length === view.rows.length ? `전체 ${total}건` : `전체 ${total}건 중 ${hit}건`;
}

function showView(key) {
  current = key;
  const view = views[key];
  for (const b of $('tabs').children) b.setAttribute('aria-selected', String(b.dataset.view === key));
  $('qLabel').textContent = view.qLabel;
  $('q').placeholder = view.placeholder;
  $('sttsLabel').textContent = view.sttsLabel;
  $('head').replaceChildren(...view.head.map((h) => el('th', {}, h)));

  const counts = new Map();
  for (const r of view.rows) counts.set(view.status(r), (counts.get(view.status(r)) || 0) + 1);
  $('stts').replaceChildren(el('option', { value: '' }, '전체'),
    ...[...counts].filter(([name]) => name).sort((a, b) => b[1] - a[1])
      .map(([name, n]) => el('option', { value: name }, `${name} (${n.toLocaleString('ko-KR')})`)));
  $('sort').replaceChildren(...Object.entries(view.sorts).map(([k, [label]]) => el('option', { value: k }, label)));

  $('q').value = view.q; $('stts').value = view.stts; $('sort').value = view.sort;
  applyFilters();
}

function openIn(key, query) {
  views[key].q = query;
  views[key].stts = '';
  showView(key);
  $('listArea').scrollIntoView({ behavior: 'smooth' });
}

/* ---------- 변동사항 ---------- */
const events = { all: [], shown: 0 };

function eventNode(e) {
  const source = e.source === 'nts' ? 'nts' : 'permit';
  let tag, body;
  if (e.type === 'changed') {
    const statusChange = e.changes.find((c) => c.field === 'SALS_STTS_NM' || c.field === 'status') || e.changes.find((c) => /STTS/.test(c.field));
    tag = statusChange ? ['상태 변경', badgeClass(statusChange.after)] : ['정보 변경', 'neutral'];
    body = e.changes.map((c) => `${c.label}: ${c.before || '(없음)'} → ${c.after || '(없음)'}`).join(' · ');
  } else if (e.type === 'new') {
    tag = ['신규 등록', 'info'];
    body = [e.status, e.licensed && `인허가일 ${fmtDate(e.licensed)}`].filter(Boolean).join(' · ');
  } else {
    tag = ['목록 삭제', 'neutral'];
    body = `직전 상태: ${e.status || '-'}`;
  }
  const name = el('button', { className: 'linklike', type: 'button', title: '이 업체를 목록에서 찾기' }, e.name || '(이름 없음)');
  name.onclick = () => openIn(source, e.name || '');
  return el('li', {},
    el('span', { className: 'when' }, e.date),
    el('span', {}, el('span', { className: 'small' }, source === 'nts' ? '국세청 ' : '인허가 '),
      el('span', { className: `badge ${tag[1]}` }, tag[0])),
    el('span', { className: 'what' }, name, el('div', {}, body), e.addr ? el('div', { className: 'small' }, e.addr) : null),
  );
}

function renderEvents() {
  const next = events.all.slice(events.shown, events.shown + EVENTS_STEP);
  $('events').append(...next.map(eventNode));
  events.shown += next.length;
  $('moreEvents').hidden = events.shown >= events.all.length;
}

/* ---------- 시작 ---------- */
async function loadJson(url) {
  const res = await fetch(url, { cache: 'no-cache' });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function init() {
  let permit, nts, changes;
  try {
    [permit, nts, changes] = await Promise.all([loadJson(views.permit.url), loadJson(views.nts.url), loadJson('data/changes.json')]);
  } catch (e) {
    $('notice').textContent = location.protocol === 'file:'
      ? '이 페이지는 파일을 직접 열어서는 데이터를 읽을 수 없습니다. 배포된 주소(GitHub Pages 등)로 접속해 주세요.'
      : `데이터를 불러오지 못했습니다. (${e.message})`;
    $('notice').hidden = false;
    return;
  }
  if (!permit) {
    $('notice').textContent = '아직 수집된 데이터가 없습니다. GitHub 저장소의 Actions 탭에서 "기획업 데이터 동기화"를 한 번 실행해 주세요.';
    $('notice').hidden = false;
    return;
  }

  views.permit.rows = permit.items;
  views.nts.rows = nts ? nts.items : [];
  for (const view of Object.values(views)) for (const r of view.rows) r._text = norm(view.text(r));
  $('meta').textContent = `행정안전부 인허가 데이터${nts ? ' · 국세청 사업자등록 상태' : ''} 기준 · 마지막 확인 ${permit.checkedAt} · 매일 자동 갱신`;

  events.all = changes || [];
  $('changesCard').hidden = false;
  $('changesMeta').textContent = events.all.length
    ? `최근 ${events.all.length.toLocaleString('ko-KR')}건 · 변동 시 메일로도 알림`
    : '아직 감지된 변동이 없습니다';
  $('moreEvents').onclick = renderEvents;
  renderEvents();

  if (nts) {
    for (const [key, view] of Object.entries(views)) {
      const tab = el('button', { type: 'button', role: 'tab' }, view.tab,
        el('span', { className: 'n' }, view.rows.length.toLocaleString('ko-KR')));
      tab.dataset.view = key;
      tab.onclick = () => showView(key);
      $('tabs').append(tab);
    }
    $('tabs').hidden = false;
  }

  let timer;
  $('q').oninput = () => { clearTimeout(timer); timer = setTimeout(applyFilters, 150); };
  $('stts').onchange = applyFilters;
  $('sort').onchange = applyFilters;
  $('form').onsubmit = (e) => { e.preventDefault(); applyFilters(); };
  new IntersectionObserver((entries) => { if (entries[0].isIntersecting) renderMore(); }, { rootMargin: '600px' })
    .observe($('sentinel'));

  $('listArea').hidden = false;
  showView('permit');
}

init();
</script>
</body>
</html>
